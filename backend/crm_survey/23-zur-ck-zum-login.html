<!DOCTYPE html>
<html data-beroot="https://backend.regionalimmobilien24.de/be-admin/" lang="de">
 <head>
  <meta charset="utf-8"/>
  <meta content="text/html; charset=utf-8" http-equiv="content-type"/>
  <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible"/>
  <meta content="noindex, nofollow" name="robots"/>
  <meta content="no-cache" http-equiv="pragma"/>
  <meta content="-1" http-equiv="expires"/>
  <meta content="no-cache" http-equiv="cache-control"/>
  <meta content="on" http-equiv="cleartype"/>
  <meta content="telephone=no" name="format-detection"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Regionalimmobilien24 | Login
  </title>
  <link href="../../ressource/combine/abd96185cfa48fef9787ab7ec9e92a2e_r26_5_0.css" media="all" rel="stylesheet"/>
  <script src="../../ressource/combine/6533f7f8c18ef5488c9f472d87f639ae_r26_5_0.js" type="text/javascript">
  </script>
 </head>
 <body class="pitcom ri24 gray-bg pitcom-login">
  <div class="loginColumns animated fadeInDown">
   <div class="row">
    <div class="col-md-12 pitcom-login-head">
     <img alt="Logo: Regionalimmobilien24" src="https://bilder.regionalimmobilien24.de/get-file/img/images/system_ri24/regions/ri24/v/550x60/max/56d2b6d1_Doppellogo-Prime-Ri24.png.webp"/>
    </div>
   </div>
   <div class="row">
    <div class="col-md-12">
     <div class="ibox-content">
      <form action="https://backend.regionalimmobilien24.de/be-admin/request/check-login/" class="m-t pitcom-coreadm-ajax-form" enctype="multipart/form-data" method="post" role="form">
       <div class="form-group">
        <label for="xuser">
         Benutzername / E-Mail
        </label>
        <input class="form-control form-no-valiinfo" id="xuser" name="l" pattern="[a-zA-Z0-9][a-zA-Z0-9\.\-_]*@[a-zA-Z0-9][a-zA-Z0-9\.\-_]*\.[a-zA-Z]+" placeholder="xyz@regionalimmobilien24.de" required="required" type="text"/>
       </div>
       <div class="form-group">
        <label for="xpw">
         Passwort
        </label>
        <input class="form-control form-no-valiinfo" id="xpw" name="p" placeholder="********" required="required" type="password"/>
       </div>
       <input name="goto" type="hidden" value=""/>
       <button class="btn btn-primary block full-width m-b cmd-login" type="submit">
        Login
       </button>
      </form>
     </div>
    </div>
   </div>
   <hr/>
   <div class="row">
    <div class="col-md-6">
     <a href="https://www.regionalimmobilien24.de/impressum/" target="_blank" title="weiter zum Impressum">
      Impressum
     </a>
     <a href="https://www.regionalimmobilien24.de/datenschutz/" target="_blank" title="weiter zur Datenschutz-Seite">
      Datenschutz
     </a>
    </div>
    <div class="col-md-6 text-right">
     © 2017-2026,
     <br/>
     Regionalimmobilien24 GmbH
    </div>
   </div>
  </div>
 </body>
</html>
