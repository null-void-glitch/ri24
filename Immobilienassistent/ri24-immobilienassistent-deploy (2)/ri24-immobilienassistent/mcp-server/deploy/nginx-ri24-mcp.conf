server {
    listen 443 ssl http2;
    server_name mcp.regionalimmobilien24.de;  # ← Change to your domain

    ssl_certificate     /usr/local/etc/letsencrypt/live/mcp.regionalimmobilien24.de/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/mcp.regionalimmobilien24.de/privkey.pem;

    # ── SSE-critical settings ────────────────────────────────────
    proxy_buffering     off;
    proxy_cache         off;
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;

    # ── Headers ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection '';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name mcp.regionalimmobilien24.de;  # ← Change to your domain
    return 301 https://$host$request_uri;
}
