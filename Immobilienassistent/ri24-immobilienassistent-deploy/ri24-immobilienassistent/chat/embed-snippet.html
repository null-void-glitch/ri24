<!--
  RI24 Immobilienassistent – DeepChat-Einbettung
  ================================================
  Dieses Snippet in das Exposé-Template einfügen (z.B. am Ende des <body>).
  Voraussetzung: chat.php ist unter ENDPOINT erreichbar (gleiche Domain empfohlen).

  Der Chat sendet die aktuelle Exposé-URL versteckt mit; der Agent (OpenAI
  Responses API + Remote-MCP) lädt daraus via getExposeData die Objektdaten.
-->

<!-- DeepChat Web-Component laden -->
<script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2/dist/deepChat.bundle.js"></script>

<deep-chat id="ri24-immobilienassistent"></deep-chat>

<script>
(function () {
  var chat = document.getElementById('ri24-immobilienassistent');

  // Endpoint des PHP-Proxys. In Produktion auf eurer Domain, z.B.:
  var ENDPOINT = '/api/chat/chat.php';

  // Eine Konversations-ID pro Seiten-/Widget-Instanz. Der Server hält daran
  // den Verlauf (previous_response_id) fest.
  var conversationId = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'c' + Date.now() + Math.random().toString(36).slice(2);

  // Die URL des aktuellen Exposés (wird versteckt an den Agent gesendet).
  var exposeUrl = window.location.href;

  // ── DeepChat konfigurieren, sobald das Custom-Element definiert ist ───────
  // Das Modul-Bundle (type="module") lädt deferred. Würden wir chat.connect
  // etc. sofort setzen, wäre <deep-chat> noch nicht „upgraded" und DeepChat
  // startet im Demo-Modus ("...can't answer that question..."). whenDefined
  // stellt sicher, dass die Konfiguration greift.
  customElements.whenDefined('deep-chat').then(function () {

  // ── Verbindung: Streaming gegen den PHP-Proxy ────────────────────────────
  chat.connect = { url: ENDPOINT, method: 'POST', stream: true };

  // Exposé-URL + Konversations-ID an jeden Request anhängen.
  chat.requestInterceptor = function (requestDetails) {
    requestDetails.body.expose_url = exposeUrl;
    requestDetails.body.conversation_id = conversationId;
    return requestDetails;
  };

  // ── Erscheinungsbild ─────────────────────────────────────────────────────
  chat.style =
    'border-radius:14px;border:1px solid #e2e5ea;width:100%;max-width:420px;height:600px;' +
    'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;';
  chat.textInput = {
    placeholder: { text: 'Frag mich etwas zu dieser Immobilie …' },
    styles: { text: { color: '#111' } }
  };
  chat.submitButtonStyles = {
    submit: { container: { default: { backgroundColor: '#0b6b3a' } } }
  };
  chat.messageStyles = {
    default: {
      ai:   { bubble: { backgroundColor: '#f1f4f2', color: '#111' } },
      user: { bubble: { backgroundColor: '#0b6b3a', color: '#fff' } }
    }
  };

  // ── Klickbare Gesprächseinstiege in der Intro-Nachricht ──────────────────
  chat.htmlClassUtilities = {
    'ri24-starter': {
      events: {
        click: function (event) {
          chat.submitUserMessage({ text: event.target.textContent.trim() });
        }
      },
      styles: {
        default: {
          display: 'block', width: '100%', textAlign: 'left', cursor: 'pointer',
          margin: '6px 0', padding: '10px 12px', borderRadius: '10px',
          border: '1px solid #d7ddd9', backgroundColor: '#fff', color: '#0b6b3a',
          fontSize: '0.9rem'
        },
        hover: { backgroundColor: '#f1f4f2' }
      }
    }
  };

  chat.introMessage = {
    html:
      '<div style="line-height:1.5">' +
        '<b>👋 Willkommen!</b><br>Ich bin dein Immobilienassistent für dieses Exposé. ' +
        'Ich helfe dir bei Objektdetails, Umgebung, Finanzierung und Terminen.' +
        '<div style="margin-top:10px">' +
          '<div class="ri24-starter">Was kann diese Immobilie mir bieten? 🏠</div>' +
          '<div class="ri24-starter">Gibt es Schulen oder Supermärkte in der Nähe? 📍</div>' +
          '<div class="ri24-starter">Wie hoch wäre meine monatliche Rate beim Kauf? 💰</div>' +
          '<div class="ri24-starter">Wer ist der Ansprechpartner für diese Immobilie?</div>' +
        '</div>' +
      '</div>'
  };

  });  // customElements.whenDefined('deep-chat')
})();
</script>
