<!--
  RI24 Immobilienassistent – DeepChat-Einbettung
  ================================================
  Dieses Snippet in das Exposé-Template einfügen (z.B. am Ende des <body>).
  Voraussetzung: chat.php ist unter ENDPOINT erreichbar (gleiche Domain empfohlen).

  Der Chat sendet die aktuelle Exposé-URL versteckt mit; der Agent (OpenAI
  Responses API + Remote-MCP) lädt daraus via getExposeData die Objektdaten.

  Zusätzlich wird die URL des dem Nutzer konkret angezeigten Finanzierungsberaters
  mitgesendet (gelesen aus dem href von a.baufi-berater-label im Exposé-DOM) —
  chat.php lädt darüber dieselben Kontaktdaten live nach, die der Nutzer auch auf
  der Seite sieht (siehe Docblock in chat.php).

  Ebenfalls aus demselben Berater-Block gelesen wird die team_id (data-team-id
  am Team-Logo/-Foto), die für Finanzierungsanfragen (submitFinancingInquiry)
  benötigt wird.
-->

<!-- DeepChat Web-Component laden -->
<script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2/dist/deepChat.bundle.js"></script>

<!-- EU AI Act Art. 50: dauerhaft sichtbarer Hinweis, dass hier eine KI statt
     eines Menschen antwortet — sitzt außerhalb des Nachrichten-Scrollbereichs,
     bleibt also unabhängig vom Chatverlauf sichtbar. -->
<div style="box-sizing:border-box;width:100%;max-width:420px;background:#f1f4f2;color:#333;
  border:1px solid #e2e5ea;border-bottom:none;border-radius:14px 14px 0 0;padding:7px 14px;
  font-size:.76rem;line-height:1.3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  🤖 KI-generierter Inhalt
</div>
<deep-chat id="ri24-immobilienassistent"></deep-chat>

<script>
(function () {
  var chat = document.getElementById('ri24-immobilienassistent');

  // Endpoint des PHP-Proxys. In Produktion auf eurer Domain, z.B.:
  var ENDPOINT = '/api/chat/chat.php';

  // Eine Konversations-ID pro Seiten-/Widget-Instanz. Der Server hält daran
  // den Verlauf (previous_response_id) fest.
  var conversationId = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'c' + Date.now() + Math.random().toString(36).slice(2);

  // Die URL des aktuellen Exposés (wird versteckt an den Agent gesendet).
  var exposeUrl = window.location.href;

  // Die URL des dem Nutzer konkret angezeigten Finanzierungsberaters — derselbe
  // Link, den der Nutzer im Berater-Block der Seite sieht (a.baufi-berater-label
  // innerhalb von .financing-box-berater). Leerstring, falls kein Berater-Block
  // vorhanden ist (z.B. reines Mietobjekt ohne Finanzierungsberater).
  var beraterLink = document.querySelector('.financing-box-berater a.baufi-berater-label, a.baufi-berater-label, .financing-box-berater a');
  var beraterUrl = beraterLink ? beraterLink.href : '';

  // Team-ID des zuständigen Finanzierungsberater-Teams (data-team-id am Team-Logo/
  // -Foto innerhalb desselben Berater-Blocks) — wird 1:1 an submitFinancingInquiry
  // durchgereicht. Leerstring, falls kein Berater-Block vorhanden ist.
  var teamIdEl = beraterLink ? beraterLink.querySelector('[data-team-id]') : null;
  var teamId = teamIdEl ? (teamIdEl.getAttribute('data-team-id') || '') : '';

  // ── DeepChat konfigurieren, sobald das Custom-Element definiert ist ───────
  // Das Modul-Bundle (type="module") lädt deferred. Würden wir chat.connect
  // etc. sofort setzen, wäre <deep-chat> noch nicht „upgraded" und DeepChat
  // startet im Demo-Modus ("...can't answer that question..."). whenDefined
  // stellt sicher, dass die Konfiguration greift.
  customElements.whenDefined('deep-chat').then(function () {

  // ── Verbindung: Streaming gegen den PHP-Proxy ────────────────────────────
  chat.connect = { url: ENDPOINT, method: 'POST', stream: true };

  // Exposé-URL + Konversations-ID an jeden Request anhängen.
  chat.requestInterceptor = function (requestDetails) {
    requestDetails.body.expose_url = exposeUrl;
    requestDetails.body.conversation_id = conversationId;
    requestDetails.body.berater_url = beraterUrl;
    requestDetails.body.team_id = teamId;
    return requestDetails;
  };

  // ── Erscheinungsbild ─────────────────────────────────────────────────────
  chat.style =
    'border-radius:0 0 14px 14px;border:1px solid #e2e5ea;border-top:none;width:100%;max-width:420px;height:600px;' +
    'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;';
  chat.textInput = {
    placeholder: { text: 'Frag mich etwas zu dieser Immobilie …' },
    styles: { text: { color: '#111' } }
  };
  // width/height/borderRadius explizit setzen – ohne das zieht sich der
  // Button-Container über die volle Höhe der Eingabeleiste auf und wirkt
  // wie ein großes Viereck über dem Papierflugzeug-Icon.
  chat.submitButtonStyles = {
    submit: {
      container: { default: { backgroundColor: '#0b6b3a', width: '2.4rem', height: '2.4rem', borderRadius: '50%' } },
      svg: { styles: { default: { width: '45%', height: '45%' } } }
    }
  };
  chat.messageStyles = {
    default: {
      ai:   { bubble: { backgroundColor: '#f1f4f2', color: '#111' } },
      user: { bubble: { backgroundColor: '#0b6b3a', color: '#fff' } }
    }
  };
  // Mikrofon-Button im Eingabefeld; nach kurzer Sprechpause wird automatisch
  // abgesendet (hands-free). Sprachbefehle „stopp"/„absenden" möglich. Analog
  // zu chat/test-expose.html.
  chat.speechToText = {
    webSpeech: { language: 'de-DE' },
    // Zwischenergebnisse (interim) deaktiviert: auf Android/Chrome werden sie
    // teils nicht ersetzt, sondern an den bestehenden Text angehängt – das
    // führt zu vervielfachtem/wiederholtem Text ("Ichichich möchteich…").
    // Nur finale Segmente einfügen vermeidet das zuverlässig.
    displayInterimResults: false,
    submitAfterSilence: 2500,
    commands: { stop: 'stopp', submit: 'absenden' },
    textColor: { final: '#333333' },
    button: { active: { container: { default: { backgroundColor: '#0b6b3a' } } } }
  };

  // ── Klickbare Gesprächseinstiege in der Intro-Nachricht ──────────────────
  chat.htmlClassUtilities = {
    'ri24-starter': {
      events: {
        click: function (event) {
          chat.submitUserMessage({ text: event.target.textContent.trim() });
        }
      },
      styles: {
        default: {
          display: 'block', width: '100%', textAlign: 'left', cursor: 'pointer',
          margin: '6px 0', padding: '10px 12px', borderRadius: '10px',
          border: '1px solid #d7ddd9', backgroundColor: '#fff', color: '#0b6b3a',
          fontSize: '0.9rem'
        },
        hover: { backgroundColor: '#f1f4f2' }
      }
    }
  };

  chat.introMessage = {
    html:
      '<div style="line-height:1.5">' +
        '<b>👋 Willkommen!</b><br>Ich bin dein Immobilienassistent für dieses Exposé. ' +
        'Ich helfe dir bei Objektdetails, Umgebung, Finanzierung und Terminen.' +
        '<div style="margin-top:10px">' +
          '<div class="ri24-starter">Was kann diese Immobilie mir bieten? 🏠</div>' +
          '<div class="ri24-starter">Gibt es Schulen oder Supermärkte in der Nähe? 📍</div>' +
          '<div class="ri24-starter">Wie hoch wäre meine monatliche Rate beim Kauf? 💰</div>' +
          '<div class="ri24-starter">Wer ist der Ansprechpartner für diese Immobilie?</div>' +
        '</div>' +
      '</div>'
  };

  });  // customElements.whenDefined('deep-chat')
})();
</script>
